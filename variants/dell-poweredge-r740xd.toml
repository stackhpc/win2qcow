# Dell PowerEdge R740xd (Dell system ID / SKU 0737).
#
# Every Windows network, storage, chipset and video driver Dell publishes for
# the R740xd, so one image covers any configuration of it. Dell supports
# Windows Server, not Windows 11, on PowerEdge: these are Windows Server
# 2022/2025 packages, and `scripts/drivers.py fetch` keeps only the INFs
# Windows 11 accepts. `scripts/drivers.py coverage` checks every device below.
#
# Taken from Dell's catalog (https://downloads.dell.com/catalog/Catalog.xml.gz,
# version 26.10.08). To look for newer packages:
#   scripts/drivers.py dell-catalog --system-id 0737
#
# Not listed because Windows 11 has an inbox driver (see [[devices]]):
#   QLogic 57800/57810 (netevbda), Mellanox ConnectX-3/3 Pro (mlx4_bus), and
#   every boot storage option except PERC S140 (PERC 9/10, HBA330, BOSS-S1
#   AHCI, NVMe).

[variant]
name = "dell-poweredge-r740xd"
description = "Dell PowerEdge R740xd: all NIC, storage controller and chipset options."
# How the node identifies itself in Ironic inventory (system_vendor):
manufacturer = "Dell Inc."
product_name = "PowerEdge R740xd"
dell_system_id = "0737"

[[packages]]
id = "intel-nic"
description = "Intel I350, X550, X710/XXV710/XL710 and E810 NICs"
# Dell J99NN 25.0.0: Intel NIC Family Version 25.0 Drivers for Windows 64-bit Operating Systems
# X710/E810 from the Windows 11 25H2 builds; I350/X550 from Server 2025 (no 25H2 build).
url = "https://downloads.dell.com/FOLDER14855482M/1/Network_Driver_J99NN_WN64_25.0.0_A00.EXE"
sha256 = "1660a6035eab9c2aac876f32cea6ecbc0b1eafffc2abc28734440adc951e01e9"
include = ["*/production/25H2-x64/*", "*/production/WS2K25-x64/1G_I350/*", "*/production/WS2K25-x64/10G_X550/*", "*/production/WS2K25-x64/10G_VF_X550/*"]

