# HPE ProLiant DL360 Gen10.
#
# Every Windows network, storage, chipset, video and iLO driver HPE publishes
# for the DL360 Gen10's standard and optional devices, so one image covers any
# configuration of it. HPE supports Windows Server, not Windows 11, on
# ProLiant: these are Windows Server 2022/2025 Smart Components (cpXXXXXX.exe),
# and `scripts/drivers.py fetch` keeps only the INFs Windows 11 accepts.
# `scripts/drivers.py coverage` checks every device below.
#
# Taken from the Service Pack for ProLiant (SPP) package list and HPE Support
# Center (search "DL360 Gen10" at https://support.hpe.com, Drivers and
# Software, Windows Server 2025). HPE's file URLs are stable, so each package
# is pinned by URL and SHA-256 like the Dell ones.
#
# Not listed because Windows 11 has an inbox driver (see [[devices]]):
#   NVMe drives and the chipset SATA controller in AHCI mode.

[variant]
name = "hpe-proliant-dl360-gen10"
description = "HPE ProLiant DL360 Gen10: all NIC, storage controller, chipset and iLO options."
# How the node identifies itself in Ironic inventory (system_vendor):
manufacturer = "HPE"
product_name = "ProLiant DL360 Gen10"

[[packages]]
id = "smart-array"
description = "HPE Smart Array P408i-a/P816i-a/E208i (SmartPQI) and SR controllers"
# cp071901: HPE Smart Array Gen10, Gen10Plus and Gen11 Controller Driver for Windows Server 2022 and 2025, 1016.38.0.1003
url = "https://downloads.hpe.com/pub/softlib2/software1/sc-windows/p406765183/v285501/cp071901.exe"
sha256 = "e45c822a0e7d8729b27415a8eaa8f624598386afc03b565fe7006c485ec8733e"

[[packages]]
id = "smart-array-s100i"
description = "HPE Smart Array S100i SR Gen10 software RAID (chipset SATA in RAID mode)"
# cp052316: HPE Smart Array S100i SR Gen10 SW RAID Driver for Windows Server
url = "https://downloads.hpe.com/pub/softlib2/software1/sc-windows/p1091588108/v214409/cp052316.exe"
sha256 = "7a7756d67f1a79b780a046a935d668a0e22bba45f54a288c4d3470f88e5d14e2"
# The S100i has no inbox driver, so Windows can only boot from a volume on it
# if the driver is installed as a boot driver (see "Boot-critical drivers" in
# the README).
boot_critical = true

